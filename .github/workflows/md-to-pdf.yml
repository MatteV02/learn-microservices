name: Auto & Manual Markdown to PDF converter

on:
  push:
    paths:
      - '**/*.md'
  workflow_dispatch: # Regenerates PDFs for EVERY .md file in the repo

jobs:
  md-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed Markdown directories
        id: changed-files
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.md'
          dir_names: true

      - name: Process Markdown to PDF
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        run: |
          npm install -g @mermaid-js/mermaid-cli md-to-pdf
          
          # 1. Config for Mermaid's sandbox bypass
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json
          
          # 2. Config for md-to-pdf styling (Tight Margins)
          # You can adjust "10mm" to "0.5in" or any CSS-valid spacing
          echo '{ "pdf_options": { "margin": "10mm" } }' > md-to-pdf-config.json

          # DYNAMIC DETERMINATION: Check how this workflow was triggered
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected: Scanning whole repo for all Markdown directories..."
            FOLDERS=$(find . -type f -name "*.md" ! -path '*/.*' -exec dirname {} \; | sort -u)
          else
            echo "Push event detected: Processing updated folders only."
            FOLDERS="${{ steps.changed-files.outputs.all_changed_files }}"
          fi

          # Loop through targeted folder environments
          for folder in $FOLDERS; do
            [ -z "$folder" ] && continue
            echo "Processing folder: $folder"

            # --- 1. MERMAID TO IMAGES ---
            mkdir -p "$folder/images"
          
            shopt -s nullglob 
            for file in "$folder"/*.md; do
              filename=$(basename "$file")
              safename=$(echo "$filename" | tr ' ' '_')
          
              mmdc -i "$file" -o "$folder/$safename" -p puppeteer-config.json -e png -s 4
          
              if [ "$filename" != "$safename" ]; then
                mv "$folder/$safename" "$file"
              fi
            done
            shopt -u nullglob
          
            mv "$folder"/*.png "$folder/images/" 2>/dev/null || true
            sed -i 's|\](\./|\](images/|g' "$folder"/*.md 2>/dev/null || true

            # --- 2. MARKDOWN TO PDF ---
            rm -rf "$folder/pdf"
            mkdir -p "$folder/pdf"

            shopt -s nullglob
            for file in "$folder"/*.md; do
              echo "Converting $file to PDF with tight margins..."
          
              # THE MARGIN FIX: Appended --config-file to the execution command
              md-to-pdf --config-file md-to-pdf-config.json --launch-options='{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' "$file"
          
              filename=$(basename "$file" .md)
              if [ -f "$folder/$filename.pdf" ]; then
                mv "$folder/$filename.pdf" "$folder/pdf/"
              fi
            done
            shopt -u nullglob
          done

      - name: Commit generated PDFs
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate structural PDFs via markdown engine"
          file_pattern: '**/pdf/*.pdf'