name: Manual Markdown to PDF converter

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Path of the folder containing md files to convert'
        required: true
        type: string

jobs:
  md-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NEW STEP: Automatically convert Mermaid code blocks to images
      # This scans your folder, renders the mermaid blocks as SVGs, and updates the markdown.
      # UPDATED STEP: Automatically convert Mermaid code blocks to images with sandbox disabled
      - name: Compile Mermaid to Images
        run: |
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json
          
          # Ensure the images directory exists
          mkdir -p ${{ inputs.folder }}/images
          
          for file in ${{ inputs.folder }}/*.md; do
            # The -e png flag ensures we get PNGs instead of SVGs
            mmdc -i "$file" -o "$file" -p puppeteer-config.json -e png
          done
          
          # Move the newly generated Mermaid PNGs into the images folder
          mv ${{ inputs.folder }}/*.png ${{ inputs.folder }}/images/ 2>/dev/null || true
          
          # Rewrite the markdown links from ./filename.png to images/filename.png
          sed -i 's|\](\./\(.*\.png\))|\](images/\1)|g' ${{ inputs.folder }}/*.md

      - name: Clear old PDF folder
        run: |
          rm -rf ${{ inputs.folder }}/pdf
          mkdir -p ${{ inputs.folder }}/pdf

      # UPDATED STEP: Generate PDF with the image_import fix
      - name: Markdown to PDF and HTML
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_path: ${{inputs.folder}}
          images_dir: ${{inputs.folder}}/images
          image_import: images

      - name: Organize generated PDFs
        run: |
          mv ${{ inputs.folder }}/*.pdf ${{ inputs.folder }}/pdf/ 2>/dev/null || true

      # Save the generated PDFs as a downloadable artifact
      - name: Commit generated PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: add generated PDFs for ${{ inputs.folder }}"
          file_pattern: ${{inputs.folder}}/pdf/*.pdf