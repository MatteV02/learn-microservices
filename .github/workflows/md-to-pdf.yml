name: Auto Markdown to PDF converter

on:
  push:
    paths:
      - '**/*.md'
  workflow_dispatch: # Keeps your ability to manually trigger it

jobs:
  md-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to accurately detect changed files

      # STEP 1: Find which folders had Markdown files edited
      - name: Get changed Markdown directories
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.md'
          dir_names: true # Outputs only the folder paths (e.g., "docs/projectA")

      # STEP 2: Process Mermaid and convert to PDF
      - name: Process Markdown to PDF
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Install both Mermaid and PDF converters globally
          npm install -g @mermaid-js/mermaid-cli md-to-pdf
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json

          # Loop through every folder that triggered the action
          for folder in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Processing folder: $folder"

            # --- 1. MERMAID TO IMAGES ---
            mkdir -p "$folder/images"
          
            # Use nullglob so loop gracefully skips if no .md files are found
            shopt -s nullglob 
            for file in "$folder"/*.md; do
              filename=$(basename "$file")
              safename=$(echo "$filename" | tr ' ' '_')
          
              mmdc -i "$file" -o "$folder/$safename" -p puppeteer-config.json -e png -s 4
          
              if [ "$filename" != "$safename" ]; then
                mv "$folder/$safename" "$file"
              fi
            done
            shopt -u nullglob
          
            # Move generated mermaid PNGs to the images subfolder
            mv "$folder"/*.png "$folder/images/" 2>/dev/null || true
          
            # Update paths in the markdown
            sed -i 's|\](\./|\](images/|g' "$folder"/*.md

            # --- 2. MARKDOWN TO PDF ---
            rm -rf "$folder/pdf"
            mkdir -p "$folder/pdf"

            shopt -s nullglob
            for file in "$folder"/*.md; do
              echo "Converting $file to PDF..."
          
              # Convert using the NPM tool
              md-to-pdf "$file"
          
              # Move it to the pdf child folder
              filename=$(basename "$file" .md)
              mv "$folder/$filename.pdf" "$folder/pdf/"
            done
            shopt -u nullglob
          done

      # STEP 3: Commit all generated PDFs safely
      - name: Commit generated PDFs
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate PDFs for updated markdown files"
          file_pattern: '**/pdf/*.pdf' # Targets any pdf folder nested anywhere