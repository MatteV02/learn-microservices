# This is a basic workflow that is manually triggered
name: Manual Markdown to PDF converter

on:
  workflow_dispatch:
    inputs:
      folder:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Path of the folder containing md files to convert'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  md-to-pdf:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v6
      # Runs a single command using the runners shell
      - name: Markdown to PDF and HTML
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_path: ${{inputs.folder}}
          images_dir: ${{inputs.folder}}/images
          output_dir: ${{inputs.folder}}/pdf
      - name: Commit generated PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: add generated PDFs for ${{ inputs.folder }}"
          file_pattern: ${{inputs.folder}}/pdf/*.pdf