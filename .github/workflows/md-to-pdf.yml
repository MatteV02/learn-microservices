name: Auto & Manual Markdown to PDF converter

on:
  push:
    paths:
      - '**/*.md'
  workflow_dispatch:

jobs:
  md-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NEW: Install qpdf for merging the cover with the generated document
      - name: Install PDF Toolkit (qpdf)
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Get changed Markdown directories
        id: changed-files
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.md'
          dir_names: true

      - name: Process Markdown to PDF
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        run: |
          npm install -g @mermaid-js/mermaid-cli md-to-pdf
          
          # 1. Config for Mermaid
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json
          
          # 2. Config for Standard A4 Document
          echo '{ "pdf_options": { "format": "A4", "margin": "10mm" } }' > config-standard.json
          
          # 3. Config for Continuous Vertical Scroll
          echo '{ "pdf_options": { "format": "", "width": "210mm", "height": "5000mm", "margin": "10mm", "printBackground": true } }' > config-scroll.json

          # NEW: 4. Config for 16:9 Landscape Cover
          # Strips out default markdown padding and forces a 16:9 aspect ratio page size with 0 margins
          echo '{ "body_class": [], "pdf_options": { "width": "16in", "height": "9in", "printBackground": true, "margin": { "top": 0, "right": 0, "bottom": 0, "left": 0 } } }' > config-cover.json

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FOLDERS=$(find . -type f -name "*.md" ! -path '*/.*' -exec dirname {} \; | sort -u)
          else
            FOLDERS="${{ steps.changed-files.outputs.all_changed_files }}"
          fi

          for folder in $FOLDERS; do
            [ -z "$folder" ] && continue
            echo "Processing folder: $folder"

            # --- 1. MERMAID TO IMAGES ---
            mkdir -p "$folder/images"
            shopt -s nullglob 
            for file in "$folder"/*.md; do
              filename=$(basename "$file")
              safename=$(echo "$filename" | tr ' ' '_')
              mmdc -i "$file" -o "$folder/$safename" -p puppeteer-config.json -e png -s 4
              if [ "$filename" != "$safename" ]; then
                mv "$folder/$safename" "$file"
              fi
            done
            shopt -u nullglob
          
            mv "$folder"/*.png "$folder/images/" 2>/dev/null || true
            sed -i 's|\](\./|\](images/|g' "$folder"/*.md 2>/dev/null || true

            # --- NEW: 1.5 PROCESS HTML COVER ---
            HAS_COVER=false
            COVER_PDF="$folder/compiled_cover.pdf"
            if [ -f "$folder/cover.html" ]; then
              echo "Found cover.html in $folder. Compiling as 16:9 cover..."
              HAS_COVER=true
          
              # Pass the HTML directly to md-to-pdf. Do NOT convert to .md.
              md-to-pdf --config-file config-cover.json --launch-options='{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' "$folder/cover.html"
          
              # md-to-pdf will output cover.pdf by default
              mv "$folder/cover.pdf" "$COVER_PDF"
            fi

            # --- 2. MARKDOWN TO PDF (DUAL GENERATION) ---
            rm -rf "$folder/pdf-standard" "$folder/pdf-scroll"
            mkdir -p "$folder/pdf-standard" "$folder/pdf-scroll"

            shopt -s nullglob
            for file in "$folder"/*.md; do
              echo "Converting $file..."
              filename=$(basename "$file" .md)
          
              # A. Generate Standard Layout
              md-to-pdf --config-file config-standard.json --launch-options='{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' "$file"
              if [ -f "$folder/$filename.pdf" ]; then
                if [ "$HAS_COVER" = true ]; then
                  # Merge cover + Standard Document
                  qpdf --empty --pages "$COVER_PDF" 1-z "$folder/$filename.pdf" 1-z -- "$folder/pdf-standard/$filename.pdf"
                  rm "$folder/$filename.pdf"
                else
                  mv "$folder/$filename.pdf" "$folder/pdf-standard/"
                fi
              fi
          
              # B. Generate Continuous Scroll Layout
              md-to-pdf --config-file config-scroll.json --launch-options='{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' "$file"
              if [ -f "$folder/$filename.pdf" ]; then
                if [ "$HAS_COVER" = true ]; then
                   # Merge cover + Scroll Document
                  qpdf --empty --pages "$COVER_PDF" 1-z "$folder/$filename.pdf" 1-z -- "$folder/pdf-scroll/$filename.pdf"
                  rm "$folder/$filename.pdf"
                else
                  mv "$folder/$filename.pdf" "$folder/pdf-scroll/"
                fi
              fi
            done
            shopt -u nullglob

            # Cleanup the standalone cover PDF
            if [ "$HAS_COVER" = true ]; then
              rm "$COVER_PDF"
            fi
          
          done

      - name: Commit generated PDFs
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate standard and continuous scroll PDFs with cover arts"
          file_pattern: '**/pdf-*/*.pdf'