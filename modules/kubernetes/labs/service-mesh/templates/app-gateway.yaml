apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gateway
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-routing
spec:
  parentRefs:
    - name: app-gateway
  rules:
    # Route /users to user-service
    - matches:
        - path:
            type: PathPrefix
            value: /users
      backendRefs:
        - name: user-service
          port: 8080

    # Route /posts to post-service
    - matches:
        - path:
            type: PathPrefix
            value: /posts
      backendRefs:
        - name: post-service
          port: 8080

    # Route /comments to comment-service
    - matches:
        - path:
            type: PathPrefix
            value: /comments
      backendRefs:
        - name: comment-service
          port: 8080

    # Route /bff to bff-service
    - matches:
        - path:
            type: PathPrefix
            value: /bff
      backendRefs:
        - name: bff-service
          port: 8080

    # Default catch-all route fallback
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bff-service
          port: 8080